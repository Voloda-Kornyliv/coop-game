<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coop Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <main>
    <h1>Coop Game</h1>

    <section id="home">
      <label for="name">Your name</label>
      <input id="name" maxlength="20" placeholder="e.g. Alex" autocomplete="off">

      <button id="create-btn" class="primary">Create game</button>

      <div class="divider"><span>or join one</span></div>

      <label for="code">Game code</label>
      <div class="row">
        <input id="code" maxlength="5" placeholder="ABCDE" autocomplete="off" autocapitalize="characters">
        <button id="join-btn">Join</button>
      </div>
    </section>

    <section id="lobby" hidden>
      <p class="muted">Game code</p>
      <div id="lobby-code" class="code"></div>
      <button id="copy-btn" class="small">Copy invite link</button>

      <h2>Players <span id="player-count" class="muted"></span></h2>
      <ul id="players"></ul>

      <button id="leave-btn" class="danger">Leave game</button>
    </section>

    <p id="status" role="status"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
